{% extends "base.html" %}
{% block content %}
<style>
    .room-screen {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100vh;
        overflow: hidden;
        background:
            linear-gradient(rgba(5,0,15,0.4), rgba(5,0,15,0.6)),
            url('/static/images/door_room-bg.jpg') center/cover no-repeat;
        background-color: #1a0a2a;
    }

    .room-title {
        position: absolute;
        top: 8%;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Nosifer', serif;
        font-size: clamp(2rem, 5vw, 3rem);
        color: #ff6a00;
        text-shadow: 0 0 15px #ff4500, 0 0 30px #8b0000, 3px 3px 0 #000;
        text-align: center;
        z-index: 10;
        white-space: nowrap;
    }

    .room-desc {
        position: absolute;
        top: 16%;
        left: 50%;
        transform: translateX(-50%);
        font-family: Georgia, serif;
        font-size: 1.1rem;
        color: #ffd27f;
        text-align: center;
        font-style: italic;
        z-index: 10;
    }

    .doors-row {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        gap: 2rem;
        z-index: 10;
    }

    .door-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 200px;
        height: 220px;
        background: rgba(10, 5, 20, 0.8);
        backdrop-filter: blur(10px);
        border: 3px solid #ff6a00;
        border-radius: 15px;
        text-decoration: none;
        color: #fff;
        transition: all 0.3s;
        box-shadow: 0 0 25px rgba(255,106,0,0.4);
        position: relative;
    }

    .door-card:hover {
        transform: translateY(-15px) scale(1.05);
        box-shadow: 0 0 50px rgba(255,106,0,0.8);
        border-color: #ffd27f;
    }

    .door-card.visited {
        opacity: 0.5;
        border-color: #555;
    }

    .door-card.visited::after {
        content: '✓';
        position: absolute;
        top: 10px; right: 10px;
        background: #2a7a2a;
        color: #fff;
        width: 28px; height: 28px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
    }

    .door-icon {
        width: 70px;
        height: 70px;
        margin-bottom: 1rem;
    }

    .door-icon svg {
        width: 100%; height: 100%;
        filter: drop-shadow(0 0 10px rgba(255,106,0,0.6));
    }

    .door-name {
        font-family: 'Nosifer', serif;
        font-size: 1.2rem;
        color: #ff6a00;
        text-align: center;
        letter-spacing: 2px;
        margin-bottom: 0.3rem;
    }

    .door-hint {
        font-family: Georgia, serif;
        font-size: 0.85rem;
        color: #ccc;
        font-style: italic;
        text-align: center;
    }

    .back-btn {
        position: absolute;
        bottom: 5%;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.8rem 2rem;
        background: rgba(139,0,0,0.7);
        border: 2px solid #ff6a00;
        border-radius: 25px;
        color: #fff;
        font-family: 'Nosifer', serif;
        font-size: 1rem;
        text-decoration: none;
        transition: all 0.3s;
        z-index: 10;
    }

    .back-btn:hover {
        background: #ff4500;
        transform: translateX(-50%) scale(1.1);
    }

    @media (max-width: 700px) {
        .doors-row { flex-direction: column; gap: 1rem; }
        .door-card { width: 180px; height: 180px; }
    }
</style>

<div class="room-screen">
    <h1 class="room-title">The Ancient Door</h1>
    <p class="room-desc">Three rooms lie beyond this threshold...</p>

    <div class="doors-row">
        <a href="{{ url_for('library') }}" class="door-card {% if 'library' in visited %}visited{% endif %}">
            <div class="door-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="20" y="30" width="60" height="10" fill="#4a90e2" rx="2"/>
                    <rect x="20" y="42" width="60" height="10" fill="#e74c3c" rx="2"/>
                    <rect x="20" y="54" width="60" height="10" fill="#2ecc71" rx="2"/>
                    <rect x="20" y="66" width="60" height="10" fill="#f39c12" rx="2"/>
                </svg>
            </div>
            <div class="door-name">LIBRARY</div>
            <div class="door-hint">Ancient riddles</div>
        </a>

        <a href="{{ url_for('kitchen') }}" class="door-card {% if 'kitchen' in visited %}visited{% endif %}">
            <div class="door-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="35" fill="#2c3e50" stroke="#ff6a00" stroke-width="3"/>
                    <circle cx="50" cy="50" r="25" fill="#e67e22"/>
                    <circle cx="50" cy="50" r="15" fill="#f39c12"/>
                    <circle cx="50" cy="50" r="8" fill="#fff"/>
                </svg>
            </div>
            <div class="door-name">KITCHEN</div>
            <div class="door-hint">Something's cooking</div>
        </a>

        <a href="{{ url_for('basement') }}" class="door-card {% if 'basement' in visited %}visited{% endif %}">
            <div class="door-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="30" y="20" width="40" height="60" fill="#34495e" stroke="#ff6a00" stroke-width="2"/>
                    <rect x="35" y="25" width="30" height="50" fill="#2c3e50"/>
                    <line x1="50" y1="25" x2="50" y2="75" stroke="#ff6a00" stroke-width="2"/>
                    <line x1="35" y1="50" x2="65" y2="50" stroke="#ff6a00" stroke-width="2"/>
                </svg>
            </div>
            <div class="door-name">BASEMENT</div>
            <div class="door-hint">Dark secrets</div>
        </a>
    </div>

    <a href="{{ url_for('hall') }}" class="back-btn">← Back to Hall</a>
</div>
{% endblock %}
