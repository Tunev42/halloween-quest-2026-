{% extends "base.html" %}
{% block content %}
<style>
    .room {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 2rem !important;
        min-height: 100vh;
        /* УБРАЛИ position: fixed и overflow-y: auto */
        background: linear-gradient(rgba(5,0,15,0.5), rgba(5,0,15,0.75)),
            url('/static/images/ИМЯ-ФАЙЛА.jpg') center/cover no-repeat !important;
    }

    .room-title {
        position: absolute;
        top: 8%;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Nosifer', serif;
        font-size: clamp(2rem, 5vw, 3rem);
        color: #ff6a00;
        text-shadow: 0 0 15px #ff4500, 0 0 30px #8b0000, 3px 3px 0 #000;
        text-align: center;
        z-index: 10;
        white-space: nowrap;
    }

    .room-desc {
        position: absolute;
        top: 16%;
        left: 50%;
        transform: translateX(-50%);
        font-family: Georgia, serif;
        font-size: 1.1rem;
        color: #ffd27f;
        text-align: center;
        font-style: italic;
        z-index: 10;
    }

    .doors-row {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        gap: 2rem;
        z-index: 10;
    }

    .door-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 200px;
        height: 220px;
        background: rgba(10, 5, 20, 0.8);
        backdrop-filter: blur(10px);
        border: 3px solid #ff6a00;
        border-radius: 15px;
        text-decoration: none;
        color: #fff;
        transition: all 0.3s;
        box-shadow: 0 0 25px rgba(255,106,0,0.4);
        position: relative;
    }

    .door-card:hover {
        transform: translateY(-15px) scale(1.05);
        box-shadow: 0 0 50px rgba(255,106,0,0.8);
        border-color: #ffd27f;
    }

    .door-card.visited {
        opacity: 0.5;
        border-color: #555;
    }

    .door-card.visited::after {
        content: '✓';
        position: absolute;
        top: 10px; right: 10px;
        background: #2a7a2a;
        color: #fff;
        width: 28px; height: 28px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
    }

    .door-icon {
        width: 70px;
        height: 70px;
        margin-bottom: 1rem;
    }

    .door-icon svg {
        width: 100%; height: 100%;
        filter: drop-shadow(0 0 10px rgba(255,106,0,0.6));
    }

    .door-name {
        font-family: 'Nosifer', serif;
        font-size: 1.2rem;
        color: #ff6a00;
        text-align: center;
        letter-spacing: 2px;
        margin-bottom: 0.3rem;
    }

    .door-hint {
        font-family: Georgia, serif;
        font-size: 0.85rem;
        color: #ccc;
        font-style: italic;
        text-align: center;
    }

    .back-btn {
        position: absolute;
        bottom: 5%;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.8rem 2rem;
        background: rgba(139,0,0,0.7);
        border: 2px solid #ff6a00;
        border-radius: 25px;
        color: #fff;
        font-family: 'Nosifer', serif;
        font-size: 1rem;
        text-decoration: none;
        transition: all 0.3s;
        z-index: 10;
    }

    .back-btn:hover {
        background: #ff4500;
        transform: translateX(-50%) scale(1.1);
    }

    @media (max-width: 700px) {
        .doors-row { flex-direction: column; gap: 1rem; }
        .door-card { width: 180px; height: 180px; }
    }
</style>

<div class="room-screen">
    <h1 class="room-title">The Fireplace</h1>
    <p class="room-desc">The flames reveal hidden passages...</p>

    <div class="doors-row">
        <a href="{{ url_for('attic') }}" class="door-card {% if 'attic' in visited %}visited{% endif %}">
            <div class="door-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="50,15 85,45 15,45" fill="#8e44ad" stroke="#ff6a00" stroke-width="2"/>
                    <rect x="20" y="45" width="60" height="40" fill="#2c3e50" stroke="#ff6a00" stroke-width="2"/>
                    <circle cx="50" cy="35" r="8" fill="#f1c40f" opacity="0.8"/>
                </svg>
            </div>
            <div class="door-name">ATTIC</div>
            <div class="door-hint">Forgotten memories</div>
        </a>

        <a href="{{ url_for('mirror') }}" class="door-card {% if 'mirror' in visited %}visited{% endif %}">
            <div class="door-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="25" y="15" width="50" height="70" rx="5" fill="#2c3e50" stroke="#ff6a00" stroke-width="3"/>
                    <rect x="30" y="20" width="40" height="60" rx="3" fill="#3498db" opacity="0.6"/>
                    <ellipse cx="50" cy="50" rx="15" ry="20" fill="#fff" opacity="0.3"/>
                </svg>
            </div>
            <div class="door-name">MIRROR ROOM</div>
            <div class="door-hint">Truth or illusion</div>
        </a>

        <a href="{{ url_for('crypt') }}" class="door-card {% if 'crypt' in visited %}visited{% endif %}">
            <div class="door-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="50" cy="60" rx="35" ry="20" fill="#2c3e50" stroke="#ff6a00" stroke-width="2"/>
                    <ellipse cx="50" cy="50" rx="35" ry="20" fill="#34495e" stroke="#ff6a00" stroke-width="2"/>
                    <ellipse cx="50" cy="50" rx="30" ry="15" fill="#1a1a2e"/>
                    <circle cx="50" cy="45" r="8" fill="#e74c3c" opacity="0.6"/>
                </svg>
            </div>
            <div class="door-name">CRYPT</div>
            <div class="door-hint">Bones and patterns</div>
        </a>
    </div>

    <a href="{{ url_for('hall') }}" class="back-btn">← Back to Hall</a>
</div>
{% endblock %}
